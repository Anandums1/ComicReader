<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <style>
            .bg { fill: #FF9800; }
            .ray { fill: #FFEB3B; }
            .outline { stroke: #111; stroke-width: 14; stroke-linejoin: round; stroke-linecap: round; }
            .shadow { fill: #111; }
            .inner-line { stroke: #111; stroke-width: 12; stroke-linecap: round; }
        </style>
        <clipPath id="appIconClip">
            <rect x="24" y="24" width="464" height="464" rx="104" />
        </clipPath>
    </defs>

    <!-- App Icon Base -->
    <rect x="24" y="24" width="464" height="464" rx="104" class="bg" />
    
    <!-- Sunburst Rays -->
    <g clip-path="url(#appIconClip)">
        <polygon points="256,256 -100,0 -100,100" class="ray" />
        <polygon points="256,256 100,-100 200,-100" class="ray" />
        <polygon points="256,256 400,-100 500,-100" class="ray" />
        <polygon points="256,256 612,100 612,200" class="ray" />
        <polygon points="256,256 612,400 612,500" class="ray" />
        <polygon points="256,256 400,612 300,612" class="ray" />
        <polygon points="256,256 100,612 0,612" class="ray" />
        <polygon points="256,256 -100,400 -100,300" class="ray" />
    </g>
    
    <!-- Outline for App Icon Background -->
    <rect x="24" y="24" width="464" height="464" rx="104" fill="none" class="outline" />

    <!-- Shadows (Offset for Comic Depth Effect) -->
    <g transform="translate(14, 18)">
        <!-- Book Shadow -->
        <path d="M 80 390 L 256 340 L 432 390 L 432 180 L 256 130 L 80 180 Z" class="shadow" />
        <!-- Speech Bubble Shadow -->
        <path d="M 230 280 C 110 280 60 210 60 140 C 60 70 140 20 256 20 C 372 20 452 70 452 140 C 452 180 430 220 370 250 Q 380 290 410 320 Q 340 300 300 275 C 280 280 250 280 230 280 Z" class="shadow" />
    </g>
    
    <!-- Comic Book Base -->
    <path d="M 80 390 L 256 340 L 432 390 L 432 180 L 256 130 L 80 180 Z" fill="#FFFFFF" class="outline" />
    
    <!-- Left Page Action Lines -->
    <path d="M 120 215 L 225 185 M 120 255 L 225 225 M 120 295 L 225 265 M 120 335 L 225 305" class="inner-line" />
    
    <!-- Right Page Action Lines -->
    <path d="M 392 215 L 287 185 M 392 255 L 287 225 M 392 295 L 287 265 M 392 335 L 287 305" class="inner-line" />
    
    <!-- Center Fold -->
    <line x1="256" y1="130" x2="256" y2="340" class="outline" />

    <!-- Speech Bubble Pop -->
    <path d="M 230 280 C 110 280 60 210 60 140 C 60 70 140 20 256 20 C 372 20 452 70 452 140 C 452 180 430 220 370 250 Q 380 290 410 320 Q 340 300 300 275 C 280 280 250 280 230 280 Z" fill="#00E5FF" class="outline" />
    
    <!-- Reading/Ellipsis dots inside speech bubble -->
    <circle cx="166" cy="140" r="18" fill="#111" />
    <circle cx="256" cy="140" r="18" fill="#111" />
    <circle cx="346" cy="140" r="18" fill="#111" />
    
    <!-- Sparkle / Accent Stars -->
    <path d="M 80 80 L 90 100 L 110 105 L 90 110 L 80 130 L 70 110 L 50 105 L 70 100 Z" fill="#FFEB3B" class="outline" />
    <path d="M 440 380 L 445 395 L 460 400 L 445 405 L 440 420 L 435 405 L 420 400 L 435 395 Z" fill="#00E5FF" class="outline" />
</svg>